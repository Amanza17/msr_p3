controller_manager:
  ros__parameters:
    update_rate: 20
    use_sim_time: true

    rover_base_control:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    scara_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController



/**/joint_state_broadcaster:
  ros__parameters:
    interfaces:
      - position
      - velocity
      - effort
    map_interface_to_joint_state:
      position: position
      velocity: velocity
      effort: effort

/**/rover_base_control:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    use_stamped_vel: false
    use_sim_time: true
    publish_rate: 50.0

    left_wheel_names:
      - w4_link_joint
      - w5_link_joint
      - w6_link_joint

    right_wheel_names:
      - w1_link_joint
      - w2_link_joint
      - w3_link_joint

    wheel_separation: 1.10
    wheel_radius: 0.40

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true

    publish_limited_velocity: true

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 3.0
        has_acceleration_limits: true
        max_acceleration: 3.0

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.0
        has_acceleration_limits: true
        max_acceleration: 3.0

/**/scara_controller:
  ros__parameters:
    joints:
      - brazo1_link_joint
      - brazo2_link_joint
      - paloquebaja_link_joint
      - pinza_base_link_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
/**/gripper_controller:
  ros__parameters:
    joints:
      - pinza_d_link_joint
      - pinza_i_link_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
